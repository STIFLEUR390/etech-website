# NGINX Configuration for ETECH KEYS PWA
# Copiez ce fichier dans /etc/nginx/sites-available/etech-keys
# Puis créez un lien symbolique: ln -s /etc/nginx/sites-available/etech-keys /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name etech-keys.com www.etech-keys.com;
    return 301 https://etech-keys.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name etech-keys.com www.etech-keys.com;

    root /var/www/etech-keys/dist;
    index index.html;

    # SSL (à configurer selon votre certificat)
    # ssl_certificate /etc/letsencrypt/live/etech-keys.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/etech-keys.com/privkey.pem;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MIME Types
    include mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Assets avec hash - cache long
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        try_files $uri =404;
    }

    # Service Worker - pas de cache
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Workbox scripts - cache long
    location ^~ /workbox- {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        try_files $uri =404;
    }

    # Manifest - MIME type correct
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Routes SPA - fallback vers index.html
    location / {
        autoindex off;
        expires off;
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri /index.html =404;
    }
}
